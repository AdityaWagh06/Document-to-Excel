name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies (no OCR engines; AI calls are mocked)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
      - name: Run tests
        env:
          AI_PROVIDER: none
          OCR_PRELOAD: "false"
          LOG_TO_FILE: "false"
        run: python -m pytest backend/tests -q

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker:
    name: Docker validation
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config -q
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image (without OCR to keep CI fast)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          build-args: INSTALL_OCR=false
          push: false
          load: true
          tags: docextract-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          load: true
          tags: docextract-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Smoke test backend container
        run: |
          docker run -d --name be -p 5000:5000 \
            -e FLASK_ENV=development -e AI_PROVIDER=none -e OCR_PRELOAD=false \
            docextract-backend:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:5000/api/v1/health && exit 0
            sleep 2
          done
          docker logs be
          exit 1

  docker-ocr:
    name: Docker image with OCR (full build + OCR test)
    runs-on: ubuntu-latest
    needs: [backend-tests]
    if: github.event_name != 'pull_request'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for the OCR image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image with OCR (as clients build it)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          build-args: INSTALL_OCR=true
          push: false
          load: true
          tags: docextract-backend:ocr
          cache-from: type=gha,scope=backend-ocr
          cache-to: type=gha,mode=max,scope=backend-ocr
      - name: Start container with OCR preloaded
        run: |
          docker run -d --name be -p 5000:5000 \
            -e FLASK_ENV=development -e AI_PROVIDER=none -e OCR_PRELOAD=true \
            -e API_SECRET_KEY=ci-test-api-key-123456 \
            docextract-backend:ocr
          for i in $(seq 1 120); do
            if curl -fsS http://localhost:5000/api/v1/health; then echo; break; fi
            sleep 5
          done
          curl -fsS -H "X-API-Key: ci-test-api-key-123456" http://localhost:5000/api/v1/system/status | tee status.json
          python3 -c "import json; s=json.load(open('status.json')); o=s['ocr']; assert o['paddleocr'] or o['easyocr'], o"
      - name: Read a scanned invoice image with OCR
        run: |
          python3 -m pip install -q pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf", 28)
          img = Image.new("RGB", (1100, 700), "white")
          d = ImageDraw.Draw(img)
          lines = ["TAX INVOICE", "Sharma Traders Pvt Ltd", "Invoice No: INV-2026-0142",
                   "Invoice Date: 05/11/2026", "Subtotal: 1000.00", "CGST 9%: 90.00",
                   "SGST 9%: 90.00", "Total Amount: 1180.00"]
          for i, line in enumerate(lines):
              d.text((60, 50 + i * 70), line, fill="black", font=font)
          img.save("scan.png")
          PY
          curl -fsS -H "X-API-Key: ci-test-api-key-123456" -F "file=@scan.png" \
            http://localhost:5000/api/v1/upload | tee result.json
          python3 -c "import json; r=json.load(open('result.json')); assert 'INV-2026-0142' in r['raw_text'], r['raw_text']; print('total:', r['total'])"
      - name: Container logs
        if: always()
        run: docker logs be 2>&1 | tail -100

  no-docker-linux:
    name: Start without Docker (start-linux.sh)
    runs-on: ubuntu-latest
    needs: [backend-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Create .env as a client would
        run: |
          cp .env.example .env
          sed -i \
            -e "s/^SECRET_KEY=.*/SECRET_KEY=$(openssl rand -hex 32)/" \
            -e "s/^APP_ADMIN_PASSWORD=.*/APP_ADMIN_PASSWORD=CiTestPassword123/" \
            -e "s/^WHATSAPP_APP_SECRET=.*/WHATSAPP_APP_SECRET=$(openssl rand -hex 16)/" \
            -e "s/^WHATSAPP_VERIFY_TOKEN=.*/WHATSAPP_VERIFY_TOKEN=$(openssl rand -hex 16)/" \
            -e "s/^INSTALL_OCR=.*/INSTALL_OCR=false/" \
            -e "s/^OCR_PRELOAD=.*/OCR_PRELOAD=false/" \
            .env
      - name: Run start-linux.sh and check the app
        run: |
          ./start-linux.sh > server.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:5000/api/v1/health; then echo; break; fi
            sleep 5
          done
          curl -fsS http://127.0.0.1:5000/ | grep -q '<div id="root">'
          asset=$(curl -fsS http://127.0.0.1:5000/ | grep -o '/assets/[^"]*\.js' | head -1)
          curl -fsS -o /dev/null "http://127.0.0.1:5000$asset"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"CiTestPassword123"}' http://127.0.0.1:5000/api/v1/auth/login)
          test "$code" = 200
          echo "Web app, API and login OK"
      - name: Server log
        if: always()
        run: tail -60 server.log
