name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies (no OCR engines; AI calls are mocked)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
      - name: Run tests
        env:
          AI_PROVIDER: none
          OCR_PRELOAD: "false"
          LOG_TO_FILE: "false"
        run: python -m pytest backend/tests -q

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker:
    name: Docker validation
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config -q
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image (without OCR to keep CI fast)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          build-args: INSTALL_OCR=false
          push: false
          load: true
          tags: docextract-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          load: true
          tags: docextract-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Smoke test backend container
        run: |
          docker run -d --name be -p 5000:5000 \
            -e FLASK_ENV=development -e AI_PROVIDER=none -e OCR_PRELOAD=false \
            docextract-backend:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:5000/api/v1/health && exit 0
            sleep 2
          done
          docker logs be
          exit 1
